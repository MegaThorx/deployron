api:
  ip: 127.0.0.1
  port: 1337
  # Reverse proxies whose X-Forwarded-For header is trusted for rate limiting.
  # Leave unset unless the API is only reachable through the proxy.
  # trusted_proxies:
  # - 127.0.0.1

service:
  unixsocket: "./service.sock"

deployments:
- name: mydeploy1
  secret: change-me-deploy1
  description: "My test deploy service 1"
  user: root
  script:
  - echo "Hello World from mydeploy1"
  - whoami

- name: mydeploy2
  secret: change-me-deploy2
  description: "My test deploy service 2"
  user: deploy
  cron_deploy: "0 4 * * *"
  script:
  - echo "Hello World from mydeploy2"
  - whoami

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux binaries
        run: |
          mkdir build
          go build -trimpath -o build/api ./api
          go build -trimpath -o build/service ./service

      - name: Package release artifact
        run: |
          cp config.example.yml build/
          cp -R systemd build/
          cd build
          zip -r ../artifacts.zip api service config.example.yml systemd

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: deployron
          path: artifacts.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: deployron

      - name: Create or update GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts.zip \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi
